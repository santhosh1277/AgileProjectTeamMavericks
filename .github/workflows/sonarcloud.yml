name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar-scan:
    name: SonarCloud Scan Backend + Frontend
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
      - name: Build backend
        run: mvn -f StudentDashboard-api/pom.xml clean verify
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: student-dashboard-ui
        run: npm install

      # 6. Run frontend tests and generate coverage
      - name: Run frontend tests
        working-directory: student-dashboard-ui
        run:  |
          npm test -- --coverage --watchAll=false || true

      # 7. Run SonarCloud scan
      - name: SonarCloud Scan
        run: |
          npx sonar-scanner \
          -Dsonar.projectKey=santhosh1277_AgileProjectTeamMavericks \
          -Dsonar.organization=santhosh1277 \
          -Dsonar.sources=StudentDashboard-api/src,student-dashboard-ui/src \
          -Dsonar.exclusions=**/node_modules/**,**/build/**,**/target/** \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=$SONAR_TOKEN \
          -Dsonar.javascript.lcov.reportPaths=student-dashboard-ui/coverage/lcov.info
