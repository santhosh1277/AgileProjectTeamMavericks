name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar-scan:
    name: SonarCloud Scan Backend + Frontend
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------ BACKEND ------------------
      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # 3. Build backend
      - name: Build Backend
        run: mvn -f StudentDashboard-api/pom.xml clean verify

      # 4. Scan backend (Java)
      - name: SonarCloud Scan Backend
        run: |
          mvn -f StudentDashboard-api/pom.xml sonar:sonar \
            -Dsonar.projectKey=santhosh1277_AgileProjectTeamMavericks \
            -Dsonar.organization=santhosh1277 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.java.binaries=StudentDashboard-api/target/classes

      # ------------------ FRONTEND ------------------
      # 5. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 6. Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: student-dashboard-ui
        run: npm install

      # 7. Run frontend tests and generate coverage (ignore failures)
      - name: Run Frontend Tests
        working-directory: student-dashboard-ui
        run: npm test -- --coverage --watchAll=false || true

      # 8. Scan frontend (React)
      - name: SonarCloud Scan Frontend
        working-directory: student-dashboard-ui
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=santhosh1277_AgileProjectTeamMavericks \
            -Dsonar.organization=santhosh1277 \
            -Dsonar.sources=src \
            -Dsonar.exclusions=**/node_modules/**,build/** \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
