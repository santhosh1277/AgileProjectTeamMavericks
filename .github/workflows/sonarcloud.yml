name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar-ui:
    name: Scan Frontend (React)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd student-dashboard-ui
          npm install
      - name: Run SonarCloud scan (UI)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: "-DprojectBaseDir=student-dashboard-ui/.sonar-project.properties -Dsonar.login=${{ secrets.SONAR_TOKEN }}"

  sonar-api:
    name: Scan Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
      - name: Build Backend
        run: mvn -f StudentDashboard-api/pom.xml clean verify
      - name: Run SonarCloud scan (API)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: "-DprojectBaseDir=StudentDashboard-api -Dsonar.login=${{ secrets.SONAR_TOKEN }}"
