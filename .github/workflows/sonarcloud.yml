name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar-ui:
    name: Scan Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd student-dashboard-ui
          npm install
      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          organization: santhosh1277         
          projectKey: StudentDashboardUI      
          token: ${{ secrets.SONAR_TOKEN }}
          projectBaseDir: student-dashboard-ui

  sonar-api:
    name: Scan Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
      - name: Build Backend
        run: mvn -f StudentDashboard-api/pom.xml clean verify
      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          organization: santhosh1277          
          projectKey: StudentDashboardAPI      
          token: ${{ secrets.SONAR_TOKEN }}
          projectBaseDir: StudentDashboard-api
