name: SonarQube CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-sonar:
    name: SonarQube Analysis - Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and run SonarQube
        working-directory: StudentDashboard-api
        run: mvn clean verify sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  frontend-sonar:
    name: SonarQube Analysis - Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: student-dashboard-ui
        run: npm install

      - name: Run SonarQube scan
        run: |
          sonar-scanner \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=StudentDashboard-UI \
            -Dsonar.projectName="StudentDashboard UI" \
            -Dsonar.projectBaseDir=student-dashboard-ui \
            -Dsonar.sources=src
