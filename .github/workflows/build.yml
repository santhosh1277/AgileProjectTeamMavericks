name: Build and Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # --- API ---
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build API
        run: mvn clean install
        working-directory: ./api

      - name: SonarCloud Scan API
        run: |
          sonar-scanner \
            -Dsonar.organization=santhosh1277 \
            -Dsonar.projectKey=StudentDashboard-API \
            -Dsonar.projectName="StudentDashboard API" \
            -Dsonar.sources=src
        working-directory: ./api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --- UI ---
      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install UI dependencies
        run: npm install
        working-directory: ./ui

      - name: Build React UI
        run: npm run build
        working-directory: ./ui

      - name: SonarCloud Scan UI
        run: |
          sonar-scanner \
            -Dsonar.organization=santhosh1277 \
            -Dsonar.projectKey=StudentDashboard-UI \
            -Dsonar.projectName="StudentDashboard UI" \
            -Dsonar.sources=src
        working-directory: ./ui
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
