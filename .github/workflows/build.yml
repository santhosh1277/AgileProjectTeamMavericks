jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build API
        working-directory: ./api
        run: mvn clean install

      - name: SonarCloud Scan API
        working-directory: ./api
        uses: SonarSource/sonarcloud-github-action@master
        with:
          organization: santhosh1277
          projectKey: StudentDashboard-API
          projectName: "StudentDashboard API"
          token: ${{ secrets.SONAR_TOKEN }}

      - name: Build UI
        working-directory: ./ui
        run: mvn clean install   # if ui is Maven-based

      - name: SonarCloud Scan UI
        working-directory: ./ui
        uses: SonarSource/sonarcloud-github-action@master
        with:
          organization: santhosh1277
          projectKey: StudentDashboard-UI
          projectName: "StudentDashboard UI"
          token: ${{ secrets.SONAR_TOKEN }}
