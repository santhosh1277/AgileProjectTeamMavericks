spring.application.name=student-dashboard-backend
# H2 Database (file-based, auto-created)
spring.datasource.url=jdbc:h2:file:./h2/testdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create tables from JPA entities (create-drop ensures fresh schema)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ensure data.sql is applied after JPA creates/updates schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
