# Unique project key on SonarCloud
sonar.projectKey=santhosh1277_AgileProjectTeamMavericks
sonar.organization=santhosh1277
sonar.projectName=StudentDashboard-api
sonar.projectVersion=1.0

# Source directories (usually src/main/java for Spring Boot)
sonar.sources=src/main/java

# Exclude folders not needed for analysis
sonar.exclusions=**/node_modules/**,build/**,**/target/**

# Tests (optional but recommended)
sonar.tests=src/test/java
sonar.test.inclusions=**/*Test.java

# SonarCloud server URL and authentication token
sonar.host.url=https://sonarcloud.io
sonar.login=YOUR_SONAR_TOKEN   # replace with your token
